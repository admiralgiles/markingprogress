<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Air Adventure Skill Stage 3: Aviation Wheel of Fortune</title>
<style>
:root{
  --bg:#06101f; --panel:#102640; --panel2:#163254; --line:#2c4f7c; --text:#eef5ff; --muted:#9db3d1;
  --gold:#ffc83d; --hit:#2fd27c; --miss:#ff5b5b; --info:#55c8ff;
  --u:min(0.9vw,1.6vh);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background-color:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:.45em .85em;font-weight:600}
button:hover:not(:disabled){filter:brightness(1.18)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--gold);color:#1a1200;border-color:#ffd96b}
button.good{background:#14532f;border-color:var(--hit)}
button.bad{background:#5a1d24;border-color:var(--miss)}
button.danger{background:#5a1d24;border-color:#8b3340}
input,select,textarea{background:#081629;border:1px solid var(--line);border-radius:8px;padding:.4em .55em}
kbd{background:#0a1a2f;border:1px solid var(--line);border-radius:5px;padding:.1em .4em;font-family:Consolas,monospace}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.grow{flex:1;min-width:0}
.num{width:76px}
.btn-big{padding:.7em 1em;font-size:16px}

/* ---------- Scouter control panel ---------- */
#scouter{display:none;padding:12px 14px;min-height:100%}
body.mode-scouter #scouter{display:block}
body.board-here #scouter{display:none}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.title{font-size:21px;font-weight:800;color:var(--gold)}
.title small{display:block;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.conn{font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid var(--line)}
.conn.ok{color:var(--hit);border-color:var(--hit)}
.conn.bad{color:var(--miss);border-color:var(--miss)}
.grid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(400px,1.5fr) minmax(270px,1fr);gap:10px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (max-width:1050px){.grid{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--panel),#0c1f37);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.card h3{margin:0 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pcard{padding:8px;border-radius:10px;border:2px solid transparent;background:#0a1a2f;margin-bottom:8px;border-left:6px solid var(--c)}
.pcard.on{border-color:var(--c)}
.pc-top{display:flex;align-items:center;gap:8px}
.pname{font-size:17px;font-weight:700;flex:1;min-width:0}
.pscore{font-size:30px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
.pc-meta{font-size:13px;color:var(--muted);margin:2px 0 4px}
.stage-note{padding:9px 10px;border-radius:8px;background:#0a1a2f;border-left:4px solid var(--info);margin-bottom:8px;font-size:15px}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.qbox{margin-top:8px;padding:8px 10px;border-radius:8px;background:#0a1a2f}
.qtxt{font-size:17px;font-weight:700;margin:3px 0}
.answer-box{margin-top:6px;padding:8px 10px;border:1px dashed var(--gold);border-radius:8px;color:#ffe58a}
.preview{height:230px;flex:none;background:radial-gradient(ellipse at 50% 0%,#1b3f72,#0a1d38 70%);border-radius:10px;border:1px solid var(--line);position:relative}
.kb{display:grid;grid-template-columns:repeat(13,1fr);gap:5px;margin-top:6px}
.key{padding:.45em 0;font-size:18px;font-weight:800;min-width:0}
.key.hit{background:#14532f;border-color:var(--hit)}
.key.miss{background:#5a1d24;border-color:var(--miss)}
.key.off:not(.hit):not(.miss){opacity:.5}
.nato{margin-top:8px;min-height:1.4em;font-size:16px;color:#ffe58a;font-weight:700}
.log{max-height:420px;overflow:auto;font-size:13px;font-family:Consolas,monospace;color:#cfe0f7;white-space:pre-wrap}
.big-timer{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold);text-align:center;margin-top:6px}
.big-timer.low{color:var(--miss)}
.rules{font-size:14px;line-height:1.5;padding-left:18px;margin:0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0b2a4a;border:1px solid var(--gold);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;font-weight:600}
.toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(2,8,18,.78);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px;z-index:40}
#modal[hidden]{display:none}
.sheet{background:#0d2140;border:1px solid var(--line);border-radius:14px;padding:18px;width:min(920px,100%)}
.sheet h2{margin:0 0 8px;color:var(--gold)}
.sheet label{display:block;margin:10px 0;font-size:14px}
.sheet input,.sheet select,.sheet textarea{width:100%;margin-top:4px;display:block}
.sheet ul.keys{list-style:none;padding:0;margin:0}
.sheet ul.keys li{margin:6px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.nato-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.tbl{max-height:58vh;overflow:auto}
.nw{white-space:nowrap}
.ans{color:#ffe58a;font-size:13px;margin-top:3px}

/* ---------- Projector ---------- */
.projector{display:none;position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,#1b3f72 0%,#0a1d38 45%,#050d19 100%);background-color:#06101f;flex-direction:column;padding:calc(var(--u)*1) calc(var(--u)*1.6);gap:calc(var(--u)*0.8);overflow:hidden;color:var(--text);z-index:20;padding-bottom:calc(var(--u)*2.6)}
body.mode-projector .projector,body.board-here .projector{display:flex}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*0.8)}
.p-top{display:flex;align-items:center;justify-content:space-between;gap:2vw}
.p-title{font-size:calc(var(--u)*1.7);font-weight:800;color:var(--gold)}
.p-round{font-size:calc(var(--u)*2.2);font-weight:700;text-align:center}
.p-timer{font-size:calc(var(--u)*3.6);font-weight:800;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right;color:var(--gold)}
.p-timer.low{color:var(--miss)}
.p-scores{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1)}
.pc{background:rgba(16,38,64,.85);border:1px solid var(--line);border-top:calc(var(--u)*0.4) solid var(--c);border-radius:calc(var(--u)*0.8);padding:calc(var(--u)*0.6) calc(var(--u)*1);text-align:center;transition:box-shadow .3s}
.pc.on{box-shadow:0 0 0 calc(var(--u)*0.2) var(--c),0 0 calc(var(--u)*3) var(--c)}
.pn{font-size:calc(var(--u)*2.1);font-weight:800}
.ps{font-size:calc(var(--u)*4.6);font-weight:900;color:var(--c);font-variant-numeric:tabular-nums;line-height:1.15}
.pr{font-size:calc(var(--u)*1.3);color:var(--muted);min-height:1.4em}
.p-now{text-align:center;font-size:calc(var(--u)*2.2);font-weight:700;background:rgba(255,255,255,.07);border-radius:calc(var(--u)*0.6);padding:calc(var(--u)*0.5)}
.p-board{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.boardin{display:flex;flex-direction:column;align-items:center;justify-content:center}
.line{display:flex;align-items:center;justify-content:center}
.word{display:flex;align-items:center}
.sp{flex:0 0 auto}
.tile{display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:2px solid #3f74ad;box-sizing:border-box;font-weight:900;line-height:1;user-select:none}
.tile.hid{background:linear-gradient(180deg,#1b3d6b,#0e2748);box-shadow:inset 0 -4px 0 rgba(0,0,0,.3)}
.tile.shown{background:linear-gradient(180deg,#fffbe6,#f3d878);border-color:#ffe38a;color:#1a1200;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.tile.pop{animation:flip .7s ease both}
@keyframes flip{0%{transform:perspective(400px) rotateX(90deg);opacity:.2}60%{transform:perspective(400px) rotateX(-12deg);opacity:1}100%{transform:none;opacity:1}}
.p-empty{font-size:calc(var(--u)*3);color:var(--muted)}
.p-q{background:rgba(255,200,61,.08);border:1px solid var(--gold);border-radius:calc(var(--u)*0.7);padding:calc(var(--u)*0.7) calc(var(--u)*1.2);text-align:center}
.q-meta{font-size:calc(var(--u)*1.2);color:var(--gold);text-transform:uppercase;letter-spacing:.1em}
.q-txt{font-size:calc(var(--u)*2.4);font-weight:700;margin-top:4px}
.p-used{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:calc(var(--u)*0.35)}
.p-used .lbl{width:100%;text-align:center;font-size:calc(var(--u)*1.1);color:var(--muted);letter-spacing:.12em;margin-bottom:2px}
.chip{width:calc(var(--u)*2.3);height:calc(var(--u)*2.3);display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--line);font-weight:800;font-size:calc(var(--u)*1.3);color:#5f7ea6}
.chip.hit{background:var(--hit);color:#04200f;border-color:var(--hit)}
.chip.miss{background:var(--miss);color:#2a0606;border-color:var(--miss)}
.p-bottom{display:flex;align-items:center;gap:calc(var(--u)*1);font-size:calc(var(--u)*1.3);color:var(--muted)}
.p-prog{flex:1;height:calc(var(--u)*1.1);background:#0a1a2f;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.p-prog div{height:100%;background:linear-gradient(90deg,var(--info),var(--gold));transition:width .6s}
.banner{position:fixed;left:50%;top:calc(var(--u)*7);transform:translate(-50%,-10px);background:rgba(5,13,25,.94);border:2px solid var(--info);border-radius:calc(var(--u)*0.8);padding:calc(var(--u)*0.8) calc(var(--u)*1.6);font-size:calc(var(--u)*2.2);font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;white-space:nowrap;z-index:5}
.banner.show{opacity:1;transform:translate(-50%,0)}
.banner.good{border-color:var(--hit)}
.banner.bad{border-color:var(--miss)}
.splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,8,16,.82);opacity:0;pointer-events:none;transition:opacity .4s;z-index:6;text-align:center}
.splash.show{opacity:1}
.sp-r{font-size:calc(var(--u)*9);font-weight:900;color:var(--gold);letter-spacing:.05em}
.sp-c{font-size:calc(var(--u)*3.4);color:#fff}
.final{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.2);text-align:center}
.f-t{font-size:calc(var(--u)*2.2);letter-spacing:.2em;color:var(--muted)}
.f-w{font-size:calc(var(--u)*5);font-weight:900;color:var(--gold)}
.f-list{list-style:none;padding:0;margin:0;width:min(60vw,900px)}
.f-list li{display:grid;grid-template-columns:auto 1fr auto;gap:calc(var(--u)*1.2);align-items:center;padding:calc(var(--u)*0.7) calc(var(--u)*1.4);margin:calc(var(--u)*0.5) 0;border-left:calc(var(--u)*0.6) solid var(--c);background:rgba(16,38,64,.85);border-radius:calc(var(--u)*0.6);font-size:calc(var(--u)*2.6)}
.f-rank{font-weight:900;color:var(--c)}
.f-name{font-weight:700;text-align:left}
.f-score{font-weight:900;font-variant-numeric:tabular-nums}
.waiting,.blank{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1em}
.blank-t{font-size:calc(var(--u)*3);color:var(--gold);font-weight:800}
.blank-m{font-size:calc(var(--u)*2.5);color:var(--muted)}
.pfs{position:fixed;right:8px;bottom:6px;font-size:12px;opacity:.35;z-index:7}
html:fullscreen .pfs{display:none}
.pback{position:fixed;right:8px;top:6px;z-index:7;display:none}
body.board-here .pback{display:block}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
</style>
</head>
<body>
<div id="scouter"></div>

<div id="projector" class="projector">
  <div id="stage"></div>
  <div id="banner" class="banner"></div>
  <div id="splash" class="splash"></div>
  <canvas id="confetti"></canvas>
  <button class="pfs" data-act="fullscreen">Full screen (F)</button>
  <button class="pback" data-act="board-off">Back to controls (Esc)</button>
</div>

<div id="modal" hidden></div>
<div id="toast" class="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';

/* =====================================================================
   Air Adventure Skill Stage 3: Aviation Wheel of Fortune
   One file, no internet needed. Open it in Chrome or Edge.
   ?view=projector opens the board for the projector (read-only).
   Without it, you get the Scouter control panel.
   ===================================================================== */

/* ---------------- Built-in question bank ----------------
   area: 1-10 (see AREAS). level: 'easy' | 'medium' | 'hard'.
   These are the defaults. You can edit them from the control panel
   (saved in this browser), or change them here and clear the saved bank
   with "Reset to built-in". */
const AREAS = [
  '',
  'Airside and landside',
  'The Wright Brothers',
  'Aircraft components',
  'Aircraft and airport safety',
  'Pilot and air traffic control communication',
  'NATO phonetic alphabet',
  'The planets of the Solar System',
  'Leave No Trace and FOD',
  'Scale model aircraft',
  'Hot-air balloons',
  'Flight basics: the four forces',
  'Weather and flying',
  'Gliders, parachutes and model flight',
  'Aircraft types and airfields',
  'Radio and airfield safety',
  'Airport operations',
  'Stage 1: flying machines',
  'Stage 1: airports and aircraft safety',
  'Stage 1: paper aeroplanes',
  'Stage 2: parts of an aeroplane',
  'Stage 2: parachutes',
  'Stage 2: kites',
  'Stage 2: first aid and getting help',
  'Stage 2: safe behaviour at an airport'
];
const LEVELS = ['easy', 'medium', 'hard'];

const BUILTIN_QUESTIONS = [
  /* 1. Airside and landside */
  {area:1, level:'easy', q:'What is the difference between landside and airside at an airport?', a:'Landside is the public part before security, such as check-in, car parks and the arrivals hall. Airside is the secure area beyond security where aircraft operate.'},
  {area:1, level:'medium', q:'Why must passengers go through security before entering the airside area?', a:'Airside contains aircraft, runways and sensitive equipment, so screening stops prohibited items and unauthorised people getting near aircraft.'},
  {area:1, level:'hard', q:'Who can go airside without passing through passenger security, and why?', a:'Authorised staff, such as pilots, cabin crew and ground staff with a valid airside pass. They are security-vetted and use staff access controls instead.'},

  /* 2. The Wright Brothers */
  {area:2, level:'easy', q:'What was the name of the Wright Brothers\' aeroplane?', a:'The Wright Flyer (often just called the Flyer).'},
  {area:2, level:'easy', q:'In what year, and where, did Orville and Wilbur Wright make the first powered, controlled, sustained flight?', a:'1903, at Kitty Hawk, North Carolina, USA.'},
  {area:2, level:'medium', q:'How long did the first flight last, and how far did it go?', a:'About 12 seconds, covering around 37 metres (120 feet).'},
  {area:2, level:'medium', q:'Why did the Wright Brothers build their own wind tunnel?', a:'To test different wing shapes and measure lift and drag themselves, because the published data they had was unreliable.'},
  {area:2, level:'hard', q:'What was "wing warping", and which modern part of an aircraft did it lead to?', a:'Twisting the wing tips to bank and roll the aircraft. It led to the ailerons used on modern aircraft.'},

  /* 3. Aircraft components */
  {area:3, level:'easy', q:'What is the main body of an aeroplane called, where passengers and cargo are carried?', a:'The fuselage.'},
  {area:3, level:'easy', q:'Where does the pilot sit in an aeroplane?', a:'The cockpit (also called the flight deck).'},
  {area:3, level:'medium', q:'Which control surfaces on the wings move to roll the aircraft?', a:'Ailerons.'},
  {area:3, level:'medium', q:'Which tail control moves the nose left or right, and which moves it up or down?', a:'The rudder moves the nose left or right (yaw). The elevators move it up or down (pitch).'},
  {area:3, level:'medium', q:'What do flaps do, and when are they used?', a:'They increase lift at low speed, so the aircraft can take off and land more slowly. They are extended for take-off and landing.'},
  {area:3, level:'hard', q:'When the left aileron goes up, what does the right aileron do, and what happens to the aircraft?', a:'The right aileron goes down. The left wing loses lift and drops while the right wing gains lift, so the aircraft rolls to the left.'},
  {area:3, level:'hard', q:'Why does a pilot need both the ailerons and the rudder to turn an aeroplane smoothly?', a:'The ailerons bank (roll) the aircraft, and the rudder keeps the nose pointing into the turn, so the turn is coordinated and the aircraft does not skid or slip sideways.'},

  /* 4. Aircraft and airport safety */
  {area:4, level:'easy', q:'Why must you never walk behind a running aeroplane engine?', a:'The jet blast or propeller wash can knock people over, and the engine can suck objects and people in, causing serious injury.'},
  {area:4, level:'easy', q:'What should you always do before walking near an aircraft on the ground?', a:'Stay in the marked safe areas, keep clear of wing tips, propellers and engine intakes, and only approach when ground staff say it is safe.'},
  {area:4, level:'medium', q:'What is a "sterile cockpit"?', a:'A rule that stops non-essential talk and activity in the cockpit during critical phases, such as below 10,000 feet, so the crew can focus on flying the aircraft.'},
  {area:4, level:'hard', q:'Why does a pilot carry out a pre-flight check, and name one thing they look for.', a:'To confirm the aircraft is safe, serviceable and legal to fly. Examples include fuel, control surfaces, instruments and any damage.'},

  /* 5. Pilot and ATC communication */
  {area:5, level:'easy', q:'Why do pilots and air traffic controllers talk to each other?', a:'To keep aircraft safely apart, and to give and receive instructions, clearances and information.'},
  {area:5, level:'medium', q:'Why do pilots and controllers use standard radio phrases?', a:'So everyone understands the same words quickly and clearly, which reduces mistakes, especially where English is not the first language of everyone involved.'},
  {area:5, level:'medium', q:'What does "Wilco" mean on the radio?', a:'"Will comply": I have received your message and will do what you asked.'},
  {area:5, level:'hard', q:'What is the difference between "Roger" and "Affirm" on the radio?', a:'"Roger" means "I have received and understood your last message". It does not mean yes. "Affirm" means yes.'},

  /* 6. NATO phonetic alphabet */
  {area:6, level:'easy', q:'What is the NATO phonetic word for the letter B?', a:'Bravo.'},
  {area:6, level:'easy', q:'Spell the word FLY using the NATO phonetic alphabet.', a:'Foxtrot, Lima, Yankee.'},
  {area:6, level:'medium', q:'What is the NATO phonetic word for the letter A?', a:'Alfa (spelt with an "f", as in the ICAO list).'},
  {area:6, level:'medium', q:'Spell the word AIR using the NATO phonetic alphabet.', a:'Alfa, India, Romeo.'},
  {area:6, level:'hard', q:'What is the NATO phonetic word for the letter X, and how is it written?', a:'X-ray (with a hyphen, as in the ICAO spelling).'},
  {area:6, level:'hard', q:'What is the NATO phonetic word for the letter J, and how is it spelt?', a:'Juliett, with two Ts.'},

  /* 7. The planets */
  {area:7, level:'easy', q:'How many planets are there in the Solar System?', a:'Eight: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune.'},
  {area:7, level:'easy', q:'Which planet is closest to the Sun?', a:'Mercury.'},
  {area:7, level:'medium', q:'Which is the largest planet in the Solar System?', a:'Jupiter.'},
  {area:7, level:'medium', q:'Which planet is known as the Red Planet?', a:'Mars.'},
  {area:7, level:'hard', q:'Why is Pluto no longer classed as a planet?', a:'In 2006 the International Astronomical Union reclassified it as a dwarf planet, because it has not cleared other objects out of its orbital path.'},
  {area:7, level:'medium', q:'Which planet is third from the Sun, and is the only planet known to support life?', a:'Earth.'},

  /* 8. Leave No Trace and FOD */
  {area:8, level:'easy', q:'What does FOD stand for?', a:'Foreign Object Debris (sometimes called Foreign Object Damage).'},
  {area:8, level:'easy', q:'Name one example of FOD that could be found on an airfield.', a:'Any loose item such as a stone, nut, bolt, wire, tool or plastic bag.'},
  {area:8, level:'medium', q:'Why is FOD dangerous to aircraft?', a:'It can be sucked into jet engines or damage tyres, which can cause engine failure or a tyre blowout.'},
  {area:8, level:'medium', q:'Name one Leave No Trace principle and what it means.', a:'For example "Leave what you find" (do not take or damage natural things) or "Dispose of waste properly" (pack it in, pack it out). Any one of the seven principles is fine.'},
  {area:8, level:'hard', q:'Why does litter near an airport matter for aviation safety?', a:'It attracts birds and wildlife, which raises the risk of bird strikes, and loose litter can become FOD that damages aircraft.'},

  /* 9. Scale model aircraft */
  {area:9, level:'easy', q:'What is a scale model?', a:'An accurate replica of a real object, made smaller in the same proportions as the original.'},
  {area:9, level:'medium', q:'What does a scale of 1:72 mean?', a:'1 unit on the model equals 72 of the same units on the real aircraft. So 1 cm on the model is 72 cm (0.72 m) on the real aircraft.'},
  {area:9, level:'medium', q:'What is the "sprue" in a plastic model kit?', a:'The plastic frame the parts are moulded on. Parts are cut off the sprue before assembly.'},
  {area:9, level:'hard', q:'Why do modellers usually apply a primer before painting?', a:'It gives the paint something to grip, provides an even base colour, and shows up surface flaws to fix before the final coat.'},

  /* 10. Hot-air balloons */
  {area:10, level:'easy', q:'What makes a hot-air balloon rise?', a:'Air heated inside the envelope is less dense than the cooler air outside, so the balloon gets lift (buoyancy).'},

/* ---------------- Settings ---------------- */
const COLOURS = ['#ff8a4c', '#3fd0c9', '#c58bff'];
const POINTS_PER_LETTER = 10;
const SOLVE_BONUS = 50;
const KEY_STATE = 'awwof.state.v1';
const KEY_PUB = 'awwof.public.v1';
const KEY_BANK = 'awwof.bank.v1';
const KEY_HB = 'awwof.projector.heartbeat';
const KEY_PREFS = 'awwof.prefs.v1';

/* ---------------- Helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trim = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
const MODE = new URLSearchParams(location.search).get('view') === 'projector' ? 'projector' : 'scouter';
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function jparse(s, fb) { try { const v = JSON.parse(s); return (v === null || v === undefined) ? fb : v; } catch (e) { return fb; } }
function normPhrase(s) { return String(s || '').toUpperCase().replace(/[^A-Z]+/g, ' ').trim(); }
function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }

let PREFS = Object.assign({muted: false}, jparse(lsGet(KEY_PREFS), {}));
function savePrefs() { lsSet(KEY_PREFS, JSON.stringify(PREFS)); }

/* ---------------- Bank (questions and phrases) ---------------- */
function defaultBank() {
  return {
    questions: BUILTIN_QUESTIONS.map((q, i) => Object.assign({id: 'q' + String(i + 1).padStart(2, '0')}, q)),
    phrases: BUILTIN_PHRASES.map((p, i) => Object.assign({id: 'p' + String(i + 1).padStart(2, '0')}, p))
  };
}
function loadBank() {
  const b = jparse(lsGet(KEY_BANK), null);
  if (!(b && Array.isArray(b.questions) && Array.isArray(b.phrases))) return defaultBank();
  // Add any built-in questions or phrases that are new since this browser last saved the bank.
  // Edited or deleted items are not restored, because only missing ids are added.
  const d = defaultBank();
  d.questions.forEach(q => { if (!b.questions.some(x => x.id === q.id)) b.questions.push(q); });
  d.phrases.forEach(p => { if (!b.phrases.some(x => x.id === p.id)) b.phrases.push(p); });
  return b;
}
let BANK = loadBank();
function saveBank() { lsSet(KEY_BANK, JSON.stringify(BANK)); }

/* ---------------- Game state ---------------- */
function newGame() {
  return {
    eventSeq: 0, event: null,
    patrols: [
      {name: 'Eagles', score: 0, turns: 0},
      {name: 'Falcons', score: 0, turns: 0},
      {name: 'Kestrels', score: 0, turns: 0}
    ],
    active: 0,            // index of the Patrol whose turn it is
    roundNo: 0,
    totalRounds: 6,
    phrase: null,         // {id, text, category, level}; text is hidden from the projector
    guessed: {},          // letter -> 'hit' | 'miss'
    revealAll: false,
    roundPts: [0, 0, 0],
    roundStart: null,     // {active, turns} for "Reset this round"
    stage: 'idle',        // idle | choose | answering | guess | ended
    question: null,       // {id, area, level, q, a}; a is Scouter only
    questionShown: false,
    timerEnd: null,
    timerSecs: 30,
    usedQ: [],
    usedP: [],
    screen: 'board',      // board | blank | final
    finished: false,
    log: []
  };
}
function loadState() {
  const s = jparse(lsGet(KEY_STATE), null);
  return (s && Array.isArray(s.patrols) && s.patrols.length === 3) ? s : newGame();
}
let S = loadState();
let undoStack = [];
let prevEventId = S.event ? S.event.id : 0;

function logMsg(msg) {
  const t = new Date().toLocaleTimeString('en-IE', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
  S.log.unshift(t + '  ' + msg);
  if (S.log.length > 150) S.log.length = 150;
}
function setEvent(kind, extra) {
  S.eventSeq = (S.eventSeq || 0) + 1;
  S.event = Object.assign({id: S.eventSeq, kind}, extra || {});
}
function advance() { S.active = (S.active + 1) % 3; }
function letterCount(L) { let n = 0; for (const ch of S.phrase.text) if (ch === L) n++; return n; }
function allRevealed() {
  const letters = new Set(S.phrase.text.replace(/ /g, '').split(''));
  return [...letters].every(L => S.guessed[L] === 'hit');
}
function pickPhrase(level) {
  const match = p => level === 'any' || p.level === level;
  let pool = BANK.phrases.filter(p => match(p) && !S.usedP.includes(p.id));
  if (!pool.length) {
    const all = BANK.phrases.filter(match);
    if (!all.length) return null;
    S.usedP = S.usedP.filter(id => !all.some(p => p.id === id));
    pool = all;
    logMsg('All ' + (level === 'any' ? '' : level + ' ') + 'phrases used, so the list has been recycled');
  }
  return pool[Math.floor(Math.random() * pool.length)];
}
function pickQuestion(level) {
  const match = q => level === 'any' || q.level === level;
  let pool = BANK.questions.filter(q => match(q) && !S.usedQ.includes(q.id));
  if (!pool.length) {
    const all = BANK.questions.filter(match);
    if (!all.length) return null;
    S.usedQ = S.usedQ.filter(id => !all.some(q => q.id === id));
    pool = all;
    logMsg('All ' + (level === 'any' ? '' : level + ' ') + 'questions used, so the list has been recycled');
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function stageText() {
  const a = S.patrols[S.active].name;
  switch (S.stage) {
    case 'idle':
      if (S.finished) return 'Game finished. Start a new game, or go back to the game.';
      if (S.roundNo >= S.totalRounds) return 'All rounds have been played. Finish the game to show the leaderboard.';
      return 'No round running. Pick a phrase and start the round.';
    case 'choose': return a + ' to take the next turn. Choose a question for them.';
    case 'answering': return a + ' is answering over the radio. Mark the answer correct or incorrect.';
    case 'guess': return a + ' answered correctly. They can call a letter (NATO word, then click it) or try the whole phrase.';
    case 'ended': return 'Round over. Start the next round when ready.';
  }
  return '';
}

/* Projector payload: everything the projector may show, and nothing else.
   No answers, no hidden phrase. Hidden letters are null on the board. */
function buildPublic() {
  const p = S.phrase;
  const board = [];
  let total = 0, shown = 0;
  if (p) {
    for (const ch of p.text) {
      if (ch === ' ') { board.push(' '); continue; }
      total++;
      const open = S.revealAll || S.guessed[ch] === 'hit';
      if (open) shown++;
      board.push(open ? ch : null);
    }
  }
  return {
    screen: S.screen,
    patrols: S.patrols.map((pt, i) => ({name: pt.name, score: pt.score, round: S.roundPts[i] || 0, colour: COLOURS[i]})),
    active: S.active,
    stage: S.stage,
    roundNo: S.roundNo,
    totalRounds: S.totalRounds,
    category: p ? p.category : '',
    hasPhrase: !!p,
    board,
    used: Object.assign({}, S.guessed),
    question: (S.question && S.questionShown) ? {text: S.question.q, area: AREAS[S.question.area], level: S.question.level} : null,
    timerEnd: S.timerEnd,
    event: S.event,
    progress: total ? shown / total : 0
  };
}

/* ---------------- Persistence ---------------- */
function persist() {
  lsSet(KEY_STATE, JSON.stringify(S));
  lsSet(KEY_PUB, JSON.stringify(buildPublic()));
}

/* Every change goes through commit(): it snapshots for undo, saves, redraws and plays sounds. */
function commit(fn) {
  const before = JSON.stringify(S);
  fn();
  const after = JSON.stringify(S);
  if (after !== before) {
    undoStack.push(before);
    if (undoStack.length > 80) undoStack.shift();
    persist();
  }
  renderScouter();
  if (S.event && S.event.id !== prevEventId) {
    prevEventId = S.event.id;
    playEvent(S.event);
  }
}
function undo() {
  if (!undoStack.length) return toast('Nothing to undo');
  const seq = S.eventSeq;
  S = JSON.parse(undoStack.pop());
  S.eventSeq = seq + 1;
  S.event = {id: S.eventSeq, kind: 'none'};
  prevEventId = S.event.id;
  logMsg('Undo');
  persist();
  renderScouter();
}

/* ---------------- Sound (synthesised, offline) ---------------- */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, start, dur, type, vol) {
  const ac = audio();
  if (!ac || PREFS.muted) return;
  const o = ac.createOscillator(), g = ac.createGain();
  const t0 = ac.currentTime + start;
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.02);
}
function sfx(name, n) {
  switch (name) {
    case 'correct': [523, 659, 784].forEach((f, i) => tone(f, i * 0.12, 0.25, 'triangle', 0.1)); break;
    case 'wrong': tone(220, 0, 0.35, 'sawtooth', 0.06); tone(165, 0.2, 0.35, 'sawtooth', 0.06); break;
    case 'reveal': for (let k = 0; k < (n || 1); k++) tone(880 + k * 110, k * 0.11, 0.12, 'square', 0.05); break;
    case 'miss': tone(300, 0, 0.25, 'triangle', 0.08); break;
    case 'solve': [523, 659, 784, 1046].forEach((f, i) => tone(f, i * 0.14, 0.35, 'triangle', 0.12)); break;
    case 'buzzer': tone(150, 0, 0.9, 'square', 0.07); break;
    case 'round': tone(660, 0, 0.2, 'sine', 0.1); tone(880, 0.18, 0.3, 'sine', 0.1); break;
    case 'final': [392, 523, 659, 784, 1046].forEach((f, i) => tone(f, i * 0.16, 0.4, 'triangle', 0.12)); break;
    case 'pass': tone(330, 0, 0.2, 'sine', 0.07); break;
  }
}
function playEvent(ev) {
  switch (ev.kind) {
    case 'reveal': sfx('reveal', ev.count); break;
    case 'miss': sfx('miss'); break;
    case 'correct': sfx('correct'); break;
    case 'incorrect': case 'wrongsolve': sfx('wrong'); break;
    case 'solve': sfx('solve'); break;
    case 'time': sfx('buzzer'); break;
    case 'round': sfx('round'); break;
    case 'final': sfx('final'); break;
    case 'pass': sfx('pass'); break;
  }
}

/* ---------------- Board layout (scales to any phrase length) ----------------
   Words are packed into lines. We try each possible line width and keep the
   layout that gives the biggest tiles that still fit the space. */
function layoutWords(lens, availW, availH) {
  const n = lens.length;
  if (!n) return null;
  const wc = lens.map(l => l * 1.12);          // letter tile plus gap
  const total = wc.reduce((a, b) => a + b, 0) + 0.84 * (n - 1);
  const maxw = Math.max(...wc);
  let best = null;
  for (let W = maxw; W <= total + 0.5; W += 0.25) {
    const lines = [];
    let cur = [], cu = 0;
    for (let i = 0; i < n; i++) {
      const add = cur.length ? 0.84 + wc[i] : wc[i];   // 0.84 = word space
      if (cur.length && cu + add > W) { lines.push(cur); cur = [i]; cu = wc[i]; }
      else { cur.push(i); cu += add; }
    }
    if (cur.length) lines.push(cur);
    let maxU = 0;
    for (const l of lines) {
      const u = l.reduce((a, i) => a + wc[i], 0) + 0.84 * (l.length - 1);
      if (u > maxU) maxU = u;
    }
    const L = lines.length;
    const tW = availW / maxU;
    const tH = availH / (1.25 * L + 0.12 * (L - 1));
    const t = Math.min(tW, tH, 180);
    if (!best || t > best.t) best = {lines, t};
  }
  return best;
}
function wordsOf(board) {
  const words = [];
  let cur = null;
  board.forEach((c, idx) => {
    if (c === ' ') { if (cur) { words.push(cur); cur = null; } }
    else { if (!cur) cur = []; cur.push({c, idx}); }
  });
  if (cur) words.push(cur);
  return words;
}
function sizeBoard(wrap, board, pops) {
  if (!wrap) return;
  const inner = wrap.querySelector('.boardin');
  if (!inner) return;
  const words = wordsOf(board || []);
  if (!words.length) { inner.innerHTML = ''; return; }
  const lay = layoutWords(words.map(w => w.length), wrap.clientWidth * 0.94, wrap.clientHeight * 0.94);
  if (!lay) return;
  const t = Math.max(10, Math.floor(lay.t));
  const gap = Math.round(t * 0.12), sp = Math.round(t * 0.6), h = Math.round(t * 1.25);
  const fs = Math.round(t * 0.66), rad = Math.max(3, Math.round(t * 0.1));
  let html = '';
  lay.lines.forEach((line, li) => {
    html += '<div class="line" style="margin-top:' + (li ? gap : 0) + 'px">';
    line.forEach((wi, k) => {
      if (k) html += '<div class="sp" style="width:' + sp + 'px"></div>';
      html += '<div class="word" style="gap:' + gap + 'px">';
      for (const cell of words[wi]) {
        const isPop = pops && pops.has(cell.idx);
        const cls = (cell.c === null ? 'hid' : 'shown') + (isPop ? ' pop' : '');
        const delay = isPop ? ';animation-delay:' + pops.get(cell.idx) + 'ms' : '';
        html += '<div class="tile ' + cls + '" style="width:' + t + 'px;height:' + h + 'px;font-size:' + fs + 'px;border-radius:' + rad + 'px' + delay + '">' + (cell.c || '') + '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  inner.innerHTML = html;
}

function toggleFS() {

function startRound() {
  if (S.finished) return toast('The game has finished. Start a new game, or go back to the game.');
  if (!(S.stage === 'idle' || S.stage === 'ended')) return toast('A round is already running.');
  if (S.roundNo >= S.totalRounds) return toast('All rounds have been played. Finish the game.');
  const sel = ($('#phraseSel') || {}).value || 'random';
  const lvl = ($('#phraseLevel') || {}).value || 'any';
  commit(() => {
    const ph = sel === 'random' ? pickPhrase(lvl) : BANK.phrases.find(p => p.id === sel);
    if (!ph) { logMsg('No phrase available for that choice'); return; }
    S.roundNo++;
    S.phrase = {id: ph.id, text: normPhrase(ph.text), category: ph.category, level: ph.level};
    if (!S.usedP.includes(ph.id)) S.usedP.push(ph.id);
    S.guessed = {};
    S.revealAll = false;
    S.roundPts = [0, 0, 0];
    S.roundStart = {active: S.active, turns: S.patrols.map(p => p.turns)};
    S.stage = 'choose';
    S.question = null;
    S.questionShown = false;
    S.timerEnd = null;
    setEvent('round', {round: S.roundNo, category: S.phrase.category});
    logMsg('Round ' + S.roundNo + ' started (' + S.phrase.category + '). ' + S.patrols[S.active].name + ' go first.');
  });
}

function pickQ() {
  if (!canPickNow()) return toast('Start a round first. Questions are picked between turns.');
  const id = ($('#qSel') || {}).value || '';
  const lvl = ($('#qLevel') || {}).value || 'any';
  commit(() => {
    const q = id ? BANK.questions.find(x => x.id === id) : pickQuestion(lvl);
    if (!q) { logMsg('No question available'); return; }
    if (S.stage === 'choose') { S.patrols[S.active].turns++; S.stage = 'answering'; }
    S.question = {id: q.id, area: q.area, level: q.level, q: q.q, a: q.a};
    S.questionShown = false;
    if (!S.usedQ.includes(q.id)) S.usedQ.push(q.id);
    logMsg('Question for ' + S.patrols[S.active].name + ': ' + AREAS[q.area] + ' (' + q.level + ')');
  });
}
function canPickNow() { return (S.stage === 'choose' || S.stage === 'answering') && !!S.phrase; }

function toggleQ() {

function passTurn() {

  commit(() => {

    advance();
    S.stage = 'choose'; S.question = null; S.questionShown = false;

function callLetter(L) {
  if (!L) return;
  if (S.stage !== 'guess') return toast(S.patrols[S.active].name + ' must answer correctly before calling a letter.');
  if (S.guessed[L]) return toast(L + ' has already been called.');
  commit(() => doLetter(L));
}
function doLetter(L) {
  const pIdx = S.active, pt = S.patrols[pIdx];
  const n = letterCount(L);
  if (n > 0) {
    S.guessed[L] = 'hit';
    const pts = n * POINTS_PER_LETTER;
    pt.score += pts;
    S.roundPts[pIdx] += pts;
    setEvent('reveal', {letter: L, phonetic: NATO[L], count: n, pts, patrol: pt.name});
    logMsg(pt.name + ': ' + NATO[L] + ' (' + L + ') × ' + n + ', +' + pts);
  } else {
    S.guessed[L] = 'miss';
    setEvent('miss', {letter: L, phonetic: NATO[L], patrol: pt.name});
    logMsg(pt.name + ': ' + NATO[L] + ' (' + L + ') not in the phrase, 0 points');
  }
  advance();
  S.question = null; S.questionShown = false;
  if (allRevealed()) {
    S.revealAll = true;
    S.stage = 'ended';
    logMsg('Every letter is now revealed. Round over (no solve bonus for finishing by letters).');
  } else {
    S.stage = 'choose';
  }
}

function sayLetter() {
  const raw = (($('#say') || {}).value || '').trim().toUpperCase().replace(/[^A-Z]/g, '');
  if (!raw) return;
  const L = PHONETIC_LOOKUP[raw] || (raw.length === 1 ? raw : null);
  if (!L) return toast('Not a NATO word. Try "Bravo".');
  if (S.stage !== 'guess') return toast(S.patrols[S.active].name + ' must answer correctly first.');
  if (S.guessed[L]) return toast(L + ' has already been called.');
  commit(() => doLetter(L));
}

function solve(ok) {
  if (S.stage !== 'guess') return toast('A phrase attempt is only possible after a correct answer.');
  commit(() => {
    const pIdx = S.active, pt = S.patrols[pIdx], nm = pt.name;
    if (ok) {
      pt.score += SOLVE_BONUS;
      S.roundPts[pIdx] += SOLVE_BONUS;
      S.revealAll = true;
      S.stage = 'ended'; S.question = null; S.questionShown = false;
      advance();
      setEvent('solve', {patrol: nm, pts: SOLVE_BONUS});
      logMsg(nm + ': phrase solved, +' + SOLVE_BONUS + '. Round over.');
    } else {
      advance();
      S.stage = 'choose'; S.question = null; S.questionShown = false;
      setEvent('wrongsolve', {patrol: nm});
      logMsg(nm + ': phrase not correct. No bonus, turn passes.');
    }
  });
}

function revealAnswer() {
  if (!S.phrase || S.stage === 'idle' || S.stage === 'ended') return;
  if (!confirm('Reveal the answer on the projector and end this round? No more points will be scored.')) return;
  commit(() => {
    S.revealAll = true;
    S.stage = 'ended'; S.question = null; S.questionShown = false;
    setEvent('reveal-answer');
    logMsg('Answer revealed by the Scouter. Round over, no further points.');
  });
}

function resetRound() {
  if (!S.roundStart || !S.phrase) return;
  if (!confirm('Reset this round? Points won this round are taken back and the same phrase restarts.')) return;
  commit(() => {
    S.patrols.forEach((p, i) => { p.score -= S.roundPts[i]; p.turns = S.roundStart.turns[i]; });
    S.roundPts = [0, 0, 0];
    S.active = S.roundStart.active;
    S.guessed = {};
    S.revealAll = false;
    S.stage = 'choose'; S.question = null; S.questionShown = false;
    S.timerEnd = null;
    setEvent('info');
    logMsg('Round ' + S.roundNo + ' reset. Round points removed. Questions already asked stay used.');
  });
}

function finishGame() {
  const live = !(S.stage === 'idle' || S.stage === 'ended');
  const msg = live ? 'A round is still running. Finish the game anyway and show the leaderboard?' : 'Finish the game and show the final leaderboard on the projector?';
  if (!confirm(msg)) return;
  commit(() => {
    S.finished = true;
    S.screen = 'final';
    S.stage = 'idle'; S.question = null; S.questionShown = false; S.timerEnd = null;
    setEvent('final');
    logMsg('Game finished. Final leaderboard on the projector.');
  });
}

function startTimer() {
  const secs = clamp(parseInt(($('#timerSecs') || {}).value, 10) || 30, 5, 600);
  commit(() => {
    S.timerSecs = secs;
    S.timerEnd = Date.now() + secs * 1000;
    logMsg('Timer started: ' + secs + ' seconds');
  });
}
function timeUp() {
  commit(() => {
    S.timerEnd = null;
    setEvent('time');
    logMsg('Time up');
  });
}

function newGameConfirm() {
  if (!confirm('Start a new game? This clears scores, rounds and the used-question list. Your question and phrase banks are kept.')) return;
  S = newGame();
  undoStack = [];
  prevEventId = 0;
  persist();
  renderScouter();
}

function exportBank() {
  const blob = new Blob([JSON.stringify(BANK, null, 2)], {type: 'application/json'});

  a.download = 'aviation-wheel-bank.json';

  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importBankFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    const data = jparse(String(rd.result || ''), null);
    if (!data || !Array.isArray(data.questions) || !Array.isArray(data.phrases)) return toast('That file is not a bank export.');
    const qs = data.questions.filter(q => q && q.q && q.a && q.area >= 1 && q.area <= 10 && LEVELS.includes(q.level))
      .map((q, i) => ({id: q.id || 'i' + Date.now().toString(36) + i, area: +q.area, level: q.level, q: String(q.q), a: String(q.a)}));
    const ps = data.phrases.map((p, i) => ({id: p.id || 'j' + Date.now().toString(36) + i, text: normPhrase(p.text), category: String(p.category || 'General'), level: LEVELS.includes(p.level) ? p.level : 'easy'}))
      .filter(p => p.text.length >= 3 && p.text.length <= 60);
    if (!confirm('Replace the whole bank with this file (' + qs.length + ' questions, ' + ps.length + ' phrases)?')) return;
    BANK = {questions: qs, phrases: ps};
    saveBank();
    toast('Bank imported');
    renderScouter();
  };
  rd.readAsText(file);
}

/* ---------------- Scouter events ---------------- */
function handleAct(act, el) {
  switch (act) {
    case 'open-projector': return openProjector();
    case 'board-here': return toggleBoardHere(true);
    case 'board-off': return toggleBoardHere(false);
    case 'fullscreen': return toggleFS();
    case 'mute': PREFS.muted = !PREFS.muted; savePrefs(); return renderScouter();
    case 'undo': return undo();
    case 'keys': return openKeys();
    case 'new-game': return newGameConfirm();
    case 'close-modal': return closeModal();
    case 'set-active': {
      const i = +el.dataset.i;
      if (!['idle', 'choose', 'ended'].includes(S.stage)) return toast('Finish the current turn before changing the Patrol.');
      return commit(() => { S.active = i; logMsg(S.patrols[i].name + ' set as active'); });
    }
    case 'adjust': {
      const i = +el.dataset.i, d = +el.dataset.d;
      const amt = Math.abs(parseInt(el.closest('.pcard').querySelector('.adj').value, 10) || 0);
      if (!amt) return toast('Enter an amount first.');
      return commit(() => {
        S.patrols[i].score += d * amt;
        logMsg(S.patrols[i].name + ' ' + (d * amt > 0 ? '+' : '') + (d * amt) + ' (manual adjustment)');
      });
    }
    case 'start-round': return startRound();
    case 'reveal-answer': return revealAnswer();
    case 'reset-round': return resetRound();
    case 'finish': return finishGame();
    case 'back-board': return commit(() => { S.screen = 'board'; S.finished = false; logMsg('Back to the game'); });
    case 'screen': {
      const s = el.dataset.s;
      return commit(() => { S.screen = s; logMsg('Projector showing: ' + (s === 'board' ? 'the board' : 'blank screen')); });
    }
    case 'pick-question': return pickQ();
    case 'toggle-q': return toggleQ();
    case 'mark-correct': return markCorrect();
    case 'mark-wrong': return markWrong();
    case 'pass': return passTurn();
    case 'solve-correct': return solve(true);
    case 'solve-wrong': return solve(false);
    case 'letter': return callLetter(el.dataset.l);
    case 'say': return sayLetter();
    case 'timer-start': return startTimer();
    case 'timer-stop': return commit(() => { S.timerEnd = null; logMsg('Timer stopped'); });
    case 'edit-questions': return openQList();
    case 'edit-phrases': return openPList();
    case 'export-bank': return exportBank();
    case 'import-bank': return $('#importFile').click();
    case 'reset-bank':
      if (!confirm('Reset the question and phrase banks to the built-in ones? Your edits will be lost.')) return;
      lsDel(KEY_BANK); BANK = defaultBank(); toast('Bank reset to built-in'); return renderScouter();
    case 'q-add': return openQForm(null);
    case 'q-edit': return openQForm(el.dataset.id);
    case 'q-save': return saveQForm(el.dataset.id || null);
    case 'q-list': return openQList();
    case 'q-del': return deleteQ(el.dataset.id);
    case 'p-add': return openPForm(null);
    case 'p-edit': return openPForm(el.dataset.id);
    case 'p-save': return savePForm(el.dataset.id || null);
    case 'p-list': return openPList();
    case 'p-del': return deleteP(el.dataset.id);
  }
}

function setupScouter() {
  document.body.classList.add('mode-scouter');
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    handleAct(el.dataset.act, el);
  });
  $('#scouter').addEventListener('input', e => {
    if (e.target.matches('.pname')) {
      const i = +e.target.dataset.i;
      S.patrols[i].name = (e.target.value.trim() || 'Patrol').slice(0, 20);
      persist();
    }
  });
  $('#scouter').addEventListener('change', e => {
    if (e.target.id === 'totalRounds') {
      S.totalRounds = clamp(parseInt(e.target.value, 10) || S.roundNo || 1, Math.max(1, S.roundNo), 20);
      persist();
      renderScouter();
    }
    if (e.target.id === 'timerSecs') {
      S.timerSecs = clamp(parseInt(e.target.value, 10) || 30, 5, 600);
      persist();
    }
  });
  $('#scouter').addEventListener('mouseover', e => {
    const b = e.target.closest && e.target.closest('button[data-l]');
    if (b) $('#nato').textContent = NATO[b.dataset.l] + ' = ' + b.dataset.l;
  });
  $('#scouter').addEventListener('keydown', e => {
    if (e.target.id === 'say' && e.key === 'Enter') { e.preventDefault(); sayLetter(); }
  });
  $('#importFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) importBankFile(f);
  });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (modalOpen()) { closeModal(); return; }
      if (document.body.classList.contains('board-here')) { toggleBoardHere(false); return; }
    }
    if (modalOpen()) return;
    const tag = e.target.tagName || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Enter') {
      if (tag === 'BUTTON') return;
      e.preventDefault();
      if (S.stage === 'answering') markCorrect();
      return;
    }
    if (e.key === 'Delete') { if (S.stage === 'answering') markWrong(); return; }
    if (e.key === 'F2') { e.preventDefault(); if (S.question) toggleQ(); return; }
    if (/^[1-3]$/.test(e.key)) {
      const i = +e.key - 1;
      if (['idle', 'choose', 'ended'].includes(S.stage) && S.active !== i) commit(() => { S.active = i; logMsg(S.patrols[i].name + ' set as active'); });
      return;
    }
    if (/^[a-zA-Z]$/.test(e.key) && S.stage === 'guess') callLetter(e.key.toUpperCase());
  });

  renderScouter();
  persist();
  setInterval(() => {
    updateConn();
    if (S.timerEnd && Date.now() >= S.timerEnd) timeUp();
    updateTimers();
  }, 500);
}

/* =====================================================================
   PROJECTOR
   ===================================================================== */
let lastRaw = null, lastPubObj = null, lastEvId = null, lastScreen = null;
let prevBoard = null, popMap = new Map();

function fmtT(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(s / 60);
  return m ? m + ':' + String(s % 60).padStart(2, '0') : String(s);
}
function currentTimerEnd() {
  return MODE === 'projector' ? (lastPubObj ? lastPubObj.timerEnd : null) : S.timerEnd;
}
function updateTimers() {
  const te = currentTimerEnd();
  const pEl = $('#ptimer');
  if (pEl) {
    if (te) { const r = te - Date.now(); pEl.textContent = fmtT(r); pEl.classList.toggle('low', r <= 5000); }
    else { pEl.textContent = ''; pEl.classList.remove('low'); }
  }
  const sEl = $('#scTimer');
  if (sEl) {
    if (te) { const r = te - Date.now(); sEl.textContent = fmtT(r); sEl.classList.toggle('low', r <= 5000); }
    else { sEl.textContent = '-'; sEl.classList.remove('low'); }
  }
}

function nowText(pub) {
  const a = pub.patrols[pub.active] ? pub.patrols[pub.active].name : '';
  switch (pub.stage) {
    case 'choose': return a + ' to take the next turn';
    case 'answering': return a + ' answering over the radio';
    case 'guess': return a + ': call a letter using the phonetic alphabet, or attempt the phrase';
    case 'ended': return 'Round complete';
  }
  return pub.roundNo ? 'Between rounds' : 'Waiting to start';
}

function boardHTML(pub) {
  const playing = pub.stage === 'choose' || pub.stage === 'answering' || pub.stage === 'guess';
  const ps = pub.patrols.map((p, i) => {
    const on = playing && i === pub.active;
    return '<div class="pc' + (on ? ' on' : '') + '" style="--c:' + p.colour + '">' +
      '<div class="pn">' + esc(p.name) + '</div>' +
      '<div class="ps">' + p.score + '</div>' +
      '<div class="pr">' + [on ? '▶ PLAYING' : '', p.round ? '+' + p.round + ' this round' : ''].filter(Boolean).join(' · ') + '</div></div>';
  }).join('');
  const used = LETTERS.split('').map(L => '<span class="chip ' + (pub.used[L] || '') + '">' + L + '</span>').join('');
  const pct = Math.round(pub.progress * 100);
  const q = pub.question
    ? '<div class="p-q"><div class="q-meta">' + esc(pub.question.area) + ' · ' + esc(pub.question.level) + '</div><div class="q-txt">' + esc(pub.question.text) + '</div></div>'
    : '';
  return '<div class="p-top"><div class="p-title">Air Adventure Skill Stage 3: Aviation Wheel of Fortune</div>' +
    '<div class="p-round">' + (pub.roundNo ? 'Round ' + pub.roundNo + ' of ' + pub.totalRounds + ' · ' + esc(pub.category) : 'Get ready') + '</div>' +
    '<div class="p-timer" id="ptimer"></div></div>' +
    '<div class="p-scores">' + ps + '</div>' +
    '<div class="p-now">' + esc(nowText(pub)) + '</div>' +
    '<div class="p-board" id="pboard"><div class="boardin">' + (pub.hasPhrase ? '' : '<div class="p-empty">Waiting for the next round</div>') + '</div></div>' +
    q +
    '<div class="p-used"><span class="lbl">Letters called</span>' + used + '</div>' +
    '<div class="p-bottom"><div class="p-prog"><div style="width:' + pct + '%"></div></div><span>' + pct + '% of the phrase revealed</span></div>';
}

function finalHTML(pub) {
  const rows = pub.patrols.map((p, i) => Object.assign({i}, p)).sort((a, b) => b.score - a.score);
  const top = rows[0].score;
  const winners = rows.filter(r => r.score === top);
  let head;
  if (top === 0) head = 'No points were scored';
  else if (winners.length === 1) head = esc(winners[0].name) + ' win the game!';
  else head = 'Joint winners: ' + winners.map(w => esc(w.name)).join(' and ');
  return '<div class="final"><div class="f-t">FINAL LEADERBOARD</div><div class="f-w">' + head + '</div>' +
    '<ol class="f-list">' + rows.map((r, k) => '<li style="--c:' + r.colour + '"><span class="f-rank">' + (k + 1) + '</span><span class="f-name">' + esc(r.name) + '</span><span class="f-score">' + r.score + '</span></li>').join('') + '</ol></div>';
}

function renderProjector(pub) {
  const stage = $('#stage');
  if (!stage) return;
  if (!pub) {
    stage.innerHTML = '<div class="waiting"><h1>Waiting for the Scouter laptop</h1><p>On the laptop, open the control panel and press <b>Open projector window</b>.</p></div>';
    return;
  }
  lastPubObj = pub;
  if (pub.screen === 'final') {
    if (lastScreen !== 'final') { confetti(); setTimeout(confetti, 900); setTimeout(confetti, 1800); }
    stage.innerHTML = finalHTML(pub);
  } else if (pub.screen === 'blank') {
    stage.innerHTML = '<div class="blank"><div class="blank-t">Air Adventure Skill Stage 3: Aviation Wheel of Fortune</div><div class="blank-m">Please wait</div></div>';
  } else {
    popMap = new Map();
    if (prevBoard && prevBoard.length === pub.board.length) {
      let k = 0;
      pub.board.forEach((c, i) => {
        if (prevBoard[i] === null && c !== null && c !== ' ') { popMap.set(i, k * 140); k++; }
      });
    }
    stage.innerHTML = boardHTML(pub);
    sizeBoard($('#pboard'), pub.board, popMap);
    prevBoard = pub.board;
    popMap = new Map();
  }
  lastScreen = pub.screen;
  const ev = pub.event;
  if (lastEvId === null) lastEvId = ev ? ev.id : 0;
  else if (ev && ev.id !== lastEvId) { lastEvId = ev.id; showEvent(ev); }
  updateTimers();
}

function showBanner(html, cls) {
  const b = $('#banner');
  b.className = 'banner ' + cls;
  b.innerHTML = html;
  void b.offsetWidth;
  b.classList.add('show');
  clearTimeout(showBanner._t);
  showBanner._t = setTimeout(() => b.classList.remove('show'), 3500);
}
function showSplash(n, cat) {
  const s = $('#splash');
  s.innerHTML = '<div><div class="sp-r">ROUND ' + n + '</div><div class="sp-c">' + esc(cat) + '</div></div>';
  s.className = 'splash';
  void s.offsetWidth;
  s.classList.add('show');
  clearTimeout(showSplash._t);
  showSplash._t = setTimeout(() => s.classList.remove('show'), 3000);
}
function showEvent(ev) {
  switch (ev.kind) {
    case 'reveal':
      return showBanner(esc(ev.phonetic) + ' = ' + esc(ev.letter) + ' &nbsp;·&nbsp; ' + ev.count + ' × ' + esc(ev.letter) + ' &nbsp;→&nbsp; <b>+' + ev.pts + '</b> ' + esc(ev.patrol), 'good');
    case 'miss':
      return showBanner(esc(ev.phonetic) + ' = ' + esc(ev.letter) + ' &nbsp;·&nbsp; not in the phrase &nbsp;·&nbsp; 0 points', 'bad');
    case 'correct':
      return showBanner('CORRECT &nbsp;·&nbsp; ' + esc(ev.patrol) + ' may call a letter or try the phrase', 'good');
    case 'incorrect':
      return showBanner('NOT CORRECT &nbsp;·&nbsp; turn passes to ' + esc(ev.next), 'bad');
    case 'pass':
      return showBanner(esc(ev.patrol) + ' pass &nbsp;·&nbsp; turn passes', '');
    case 'solve':
      confetti();
      return showBanner('PHRASE SOLVED! &nbsp;<b>+' + ev.pts + '</b> ' + esc(ev.patrol), 'good');
    case 'wrongsolve':
      return showBanner('NOT THE PHRASE &nbsp;·&nbsp; no bonus', 'bad');
    case 'time':
      return showBanner('TIME\'S UP', 'bad');
    case 'reveal-answer':
      return showBanner('ANSWER REVEALED', '');
    case 'round':
      return showSplash(ev.round, ev.category);
  }
}

/* ---------------- Confetti ---------------- */
let confettiParts = [], confettiRAF = null;
function confetti() {
  const cv = $('#confetti');
  if (!cv) return;
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#ffc83d', '#3fd0c9', '#ff8a4c', '#c58bff', '#2fd27c', '#ffffff'];
  for (let i = 0; i < 140; i++) {
    confettiParts.push({x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.3,
      vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4, s: 6 + Math.random() * 8,
      r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: cols[i % cols.length]});
  }
  if (!confettiRAF) confettiRAF = requestAnimationFrame(confettiStep);
}
function confettiStep() {
  const cv = $('#confetti');
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  confettiParts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    ctx.restore();
  });
  confettiParts = confettiParts.filter(p => p.y < cv.height + 30);
  if (confettiParts.length) confettiRAF = requestAnimationFrame(confettiStep);
  else { confettiRAF = null; ctx.clearRect(0, 0, cv.width, cv.height); }
}

/* ---------------- Projector start-up ---------------- */
function pollProjector() {
  const raw = lsGet(KEY_PUB);
  if (raw === lastRaw) return;
  lastRaw = raw;
  renderProjector(raw ? jparse(raw, null) : null);
}
function setupProjector() {
  document.body.classList.add('mode-projector');
  document.title = 'Projector: Aviation Wheel of Fortune';
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act="fullscreen"]');
    if (el) toggleFS();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F') toggleFS();
  });
  const hb = () => lsSet(KEY_HB, String(Date.now()));
  hb();
  setInterval(hb, 1000);
  pollProjector();
  setInterval(pollProjector, 250);
  window.addEventListener('storage', e => { if (e.key === KEY_PUB) pollProjector(); });
  setInterval(updateTimers, 250);
}

/* ---------------- Shared start-up ---------------- */
window.addEventListener('resize', () => {
  if (MODE === 'projector' || document.body.classList.contains('board-here')) {
    if (lastPubObj && lastPubObj.screen === 'board') sizeBoard($('#pboard'), lastPubObj.board, null);
    const cv = $('#confetti'); if (cv) { cv.width = innerWidth; cv.height = innerHeight; }
  }
  if (MODE === 'scouter') sizeBoard($('#previewBoard'), buildPublic().board, null);
});

if (MODE === 'projector') {
  setupProjector();
} else {
  setupScouter();
}
</script>
