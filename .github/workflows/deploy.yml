name: Deploy to GitHub Pages

# Builds the app and publishes it, so there is a URL judges can open on a
# phone.
#
# One-time setup, which has to be done by hand: Settings -> Pages -> Build and
# deployment -> Source -> GitHub Actions. A workflow token cannot turn Pages
# on itself (it gets "Resource not accessible by integration"), because that
# is a repository administration permission no automation is granted.
# Everything after that click is automatic.

on:
  push:
    branches:
      - main
      - claude/brave-wozniak-27x1w5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Nothing gets published if the tests are failing.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
